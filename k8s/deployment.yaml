
apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice-app
  template:
    metadata:
      labels:
        app: microservice-app
    spec:
      containers:
        - name: microservice-app
          image: zabivulla/helloworld:1.0.0
          ports:
            - containerPort: 8080
